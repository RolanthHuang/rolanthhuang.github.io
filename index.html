<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quiet Study | Yi-Hsuan Huang</title>
  <meta name="description" content="Explore Yi-Hsuan Huang's 3D study, pinned GitHub projects, live demos and CV.">
  <meta name="theme-color" content="#e6ddd0">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://rolanthhuang.github.io/">
  <meta property="og:title" content="Quiet Study | Yi-Hsuan Huang">
  <meta property="og:description" content="A minimal 3D study for projects, demos and CV.">
  <meta property="og:image" content="https://rolanthhuang.github.io/study/quiet/poster.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="study/quiet/study.css">
  <script type="importmap">{"imports":{"three":"./study/vendor/three.study.min.js"}}</script>
</head>
<body>
  <main>
    <div id="room" class="room" role="region" aria-label="Interactive 3D study" data-label="room">
      <div class="poster" aria-hidden="true" hidden></div>
      <canvas id="scene" tabindex="0" aria-label="Look around the 3D study" aria-describedby="controls-hint" data-label="look" hidden></canvas>
      <div class="hotspots">
        <nav id="wall-links" aria-label="Projects on the wall" data-label="wall"></nav>
        <button type="button" class="hotspot" data-point="about" data-open="about" hidden><span data-text="about">About &amp; CV</span></button>
      </div>
    </div>

    <header class="topbar">
      <span class="owner" data-person="name">Yi-Hsuan Huang</span>
      <nav class="nav" aria-label="In the study" data-label="navigation">
        <button type="button" data-open="projects" aria-controls="panel" data-text="projects">Projects</button>
        <button type="button" data-open="demos" aria-controls="panel" data-text="demos">Demos</button>
        <button type="button" data-open="about" aria-controls="panel" data-text="cv">CV</button>
      </nav>
      <div class="language" role="group" aria-label="Language" data-label="language">
        <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="zh" lang="zh-Hant" aria-pressed="false">中文</button>
      </div>
    </header>

    <div class="footer">
      <div class="identity">
        <h1 data-text="title">Quiet Study</h1>
        <p id="controls-hint" data-text="hint" hidden>Drag to look around · Scroll to zoom</p>
        <p id="render-status" role="status" hidden></p>
      </div>
      <div class="controls" role="group" aria-label="Camera controls" data-label="controls" hidden>
        <button type="button" data-camera="out" data-label="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" data-camera="in" data-label="zoomIn" aria-label="Zoom in">+</button>
        <button type="button" data-camera="reset" data-label="reset" aria-label="Reset view"><span aria-hidden="true">↺</span></button>
      </div>
    </div>

    <dialog id="panel" aria-labelledby="panel-title">
      <div class="drawer-head">
        <h2 id="panel-title" tabindex="-1"></h2>
        <form method="dialog"><button class="close" aria-label="Close panel" data-label="close"><span aria-hidden="true">×</span></button></form>
      </div>
      <div class="drawer-content" id="panel-content"></div>
    </dialog>

    <noscript>
      <div class="no-script">
        <a href="https://github.com/RolanthHuang">GitHub projects</a>
        <a href="cv/Yi-Hsuan_Huang_CV_EN.pdf">English CV</a>
        <a href="cv/Yi-Hsuan_Huang_CV_ZH.pdf" lang="zh-Hant">中文履歷</a>
      </div>
    </noscript>
  </main>
  <script src="assets/projects.js?v=youbike-preview"></script>
  <script type="module" src="study/quiet/study.js?v=youbike-preview"></script>
</body>
</html>
